<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Từ vựng - Minna no Nihongo (N5 Flashcard)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body
  class="bg-slate-50 text-slate-800 min-h-screen flex flex-col antialiased selection:bg-indigo-500 selection:text-white">

  <div id="app" class="flex flex-col min-h-screen">
    <header-bar></header-bar>

    <main class="flex-1 max-w-6xl w-full mx-auto px-3 sm:px-4 py-3 sm:py-6 flex flex-col gap-3 sm:gap-5">
      <div v-if="loadError"
        class="bg-amber-50 border-2 border-dashed border-amber-300 rounded-2xl p-4 sm:p-5 text-center flex flex-col items-center gap-3 shadow-xs">
        <div class="text-3xl">📂</div>
        <div>
          <div class="font-bold text-slate-800 text-sm sm:text-base">Chưa tự động nạp được file.json</div>
          <div class="text-xs text-slate-600 mt-1 max-w-md">Vui lòng chọn file bài học (ví dụ: bai_4.json) từ máy tính:</div>
        </div>
        <label
          class="cursor-pointer px-4 sm:px-5 py-2 sm:py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white text-xs sm:text-sm font-semibold rounded-xl shadow-sm transition-all flex items-center gap-2">
          <span>Chọn file bài học (.json)</span>
          <input type="file" multiple accept=".json" class="hidden" @change="handleFileUpload">
        </label>
      </div>

      <toolbar-controls></toolbar-controls>
      <flashcard-stage></flashcard-stage>
    </main>

    <vocab-modal></vocab-modal>
    <speaker-modal></speaker-modal>
  </div>

  <script type="module" src="/js/main.js"></script>
</body>

</html>
